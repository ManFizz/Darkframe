# Every push and pull request: the path a fresh machine takes (as tools/fresh-check.js
# does locally) — install, lint, bundle, tests, a smoke launch of the app.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Bundle
        run: npm run bundle

      - name: Tests
        run: npm test

      - name: Smoke launch
        run: npm run smoke
